name: Yad2 watch

on:
  schedule:
    - cron: "18 * * * *"    # every hour at :18
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # to save seen.json back to the repo

concurrency:
  group: yad2-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + headless Chromium
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Check Yad2 and send new listings to Telegram
        env:
          YAD2_SEARCH_URLS: "https://www.yad2.co.il/vehicles/cars?manufacturer=177&model=13054&subModel=133802,133801,131407,128530,128987,128531,128948,128528,128947&year=2023--1&price=-1-100000&km=-1-70000&priceOnly=1&imgOnly=1"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_FILE: seen.json
          DEBUG_DIR: debug
          USE_BROWSER: "1"
          MAX_PAGES: "1"
        run: python yad2_watcher.py

      - name: Save seen listings
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json debug 2>/dev/null)" ]; then
            git config user.name "yad2-watcher"
            git config user.email "yad2-watcher@users.noreply.github.com"
            for f in seen.json debug; do [ -e "$f" ] && git add "$f"; done
            git commit -m "Update seen listings"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
          fi
