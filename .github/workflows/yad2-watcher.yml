name: Yad2 watcher

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC), at :17
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # to save seen.json back to the repo

concurrency:
  group: yad2-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Yad2 and send new listings to Telegram
        env:
          YAD2_SEARCH_URLS: ${{ secrets.YAD2_SEARCH_URLS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_FILE: seen.json
        run: python yad2_watcher.py

      - name: Save seen listings
        if: always()
        run: |
          if [ -f seen.json ] && [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "yad2-watcher"
            git config user.email "yad2-watcher@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen listings"
            git push
          fi
